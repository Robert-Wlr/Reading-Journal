<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reading Journal</title>
<meta name="theme-color" content="#F3ECE0" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reading Journal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
<style>
:root{
  --bg:#F3ECE0;--card:#FBF7F0;--ink:#2A231C;--mu:#6B6053;--ac:#A7442A;--sage:#6F7D5C;--sand:#E8DCC8;--ln:#E2D6C3;
  --blob:#E8D3BE;--soft:#EEF0E6;--onInk:#FBF7F0;--shadow:0 10px 30px rgba(84,60,30,.10),0 2px 6px rgba(84,60,30,.06);
  --scrim:rgba(42,35,28,.32);
  --D:'Fraunces',Georgia,serif;--B:'Newsreader',Georgia,serif;
  --safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
}
[data-theme=dark]{
  --bg:#1A1612;--card:#25201A;--ink:#EFE6D8;--mu:#AB9D89;--ac:#E08A66;--sage:#A3B48B;--sand:#363029;--ln:#3A332A;
  --blob:#2C251E;--soft:#2A2E24;--onInk:#1A1612;--shadow:0 10px 30px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--B);font-size:16px}
body{min-height:100dvh;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.d{font-family:var(--D);font-variation-settings:'SOFT' 100,'WONK' 1}
.mu{color:var(--mu)}
.it{font-style:italic}
#app{max-width:520px;margin:0 auto;position:relative;min-height:100dvh;padding:calc(var(--safeT) + 26px) 20px calc(var(--safeB) + 110px);overflow-x:hidden}
.blob{position:absolute;pointer-events:none;z-index:0}
.rel{position:relative;z-index:1}
h1{margin:0;font-weight:450;font-size:34px;line-height:1.06}
h2{margin:0;font-weight:450;font-size:25px;line-height:1.15}
.card{background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:20px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:12px}
.pill{height:56px;padding:0 24px;border:none;border-radius:28px;background:var(--ink);color:var(--onInk);display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--D);font-variation-settings:'SOFT' 100,'WONK' 1;font-size:18px;font-weight:500}
.pill.sec{background:var(--sand);color:var(--ink)}
.pill.ac{background:var(--ac);color:#FBF7F0}
.pill.sm{height:44px;font-size:16px;padding:0 18px}
.pill:disabled{opacity:.45}
.grow{flex:1}
.rb{width:56px;height:56px;flex-shrink:0;border:none;border-radius:50%;background:var(--sand);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.rb.card-bg{background:var(--card);box-shadow:var(--shadow)}
.rb.s48{width:48px;height:48px}
.link{border:none;background:none;color:var(--mu);text-decoration:underline;text-underline-offset:4px;min-height:44px;padding:0 6px}
.chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);border:none}
.bar{height:10px;border-radius:5px;background:var(--sand);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--sage)}
.bar.ac>i{background:var(--ac)}
.label{font-size:14px;font-style:italic;color:var(--mu)}
.field{display:flex;flex-direction:column;gap:3px;padding:10px 18px;border-radius:22px;background:var(--bg)}
.field input,.field select,.field textarea{border:none;background:transparent;padding:0;font-family:var(--D);font-variation-settings:'SOFT' 100;font-size:18px;outline:none;width:100%;color:var(--ink)}
.field textarea{font-family:var(--B);font-size:17px;resize:none;min-height:90px}
.field.hl{box-shadow:inset 0 0 0 2px var(--sage)}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--ac)}
.seg{display:flex;background:var(--bg);border-radius:26px;padding:5px;gap:4px}
.seg button{flex:1;min-height:44px;border:none;border-radius:22px;background:transparent;font-family:var(--D);font-variation-settings:'SOFT' 100;font-size:16px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--onInk)}
.seg button:disabled{opacity:.4;cursor:default}
input[type=range]:disabled{opacity:.35}
/* nav */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeB) + 16px);width:min(488px,calc(100% - 32px));height:64px;border-radius:32px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:20}
nav.tabs button{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-radius:24px;border:none;background:transparent;color:var(--mu)}
nav.tabs button[aria-current=page]{background:var(--ink);color:var(--onInk);padding:0 16px}
nav.tabs button span{display:none;font-family:var(--D);font-variation-settings:'SOFT' 100;font-size:15px}
nav.tabs button[aria-current=page] span{display:inline}
/* cover */
.cover{flex-shrink:0;border-radius:6px 12px 12px 6px;overflow:hidden;position:relative;box-shadow:0 12px 24px rgba(42,35,28,.22);background:#3E5A48;color:#F3ECE0}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;padding:10px 8px;font-family:var(--D);font-variation-settings:'SOFT' 100;font-weight:600;line-height:1.05;display:flex;flex-direction:column;justify-content:space-between}
.cover .ph small{font-family:var(--B);font-style:italic;font-weight:400;opacity:.85}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(0,0,0,.18)}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);max-height:92dvh;overflow:auto;background:var(--card);border-radius:34px 34px 0 0;padding:14px 22px calc(var(--safeB) + 28px);z-index:41;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 14px}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.full{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:calc(var(--safeT) + 22px) 20px calc(var(--safeB) + 30px)}
.full .inner{max-width:520px;margin:0 auto;position:relative;min-height:100%}
.bignum{width:160px;border:none;background:transparent;text-align:center;font-family:var(--D);font-variation-settings:'SOFT' 100,'WONK' 1;font-size:80px;font-weight:400;padding:0;line-height:1;color:var(--ink);outline:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safeB) + 96px);background:var(--ink);color:var(--onInk);padding:12px 20px;border-radius:24px;z-index:60;font-size:15px;box-shadow:var(--shadow);animation:fade .2s}
.sess{display:flex;align-items:center;gap:12px;padding:10px 4px;border:none;background:none;width:100%;text-align:left;min-height:44px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--sage);flex-shrink:0}
.dot.on{background:var(--sage)}
.week{display:flex;justify-content:space-between}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.week b{width:30px;height:30px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--onInk)}
.week b.on{background:var(--ac)}
.week b.today{box-shadow:0 0 0 2px var(--ac) inset;background:transparent;color:var(--ac)}
.week b.today.on{background:var(--ac);color:#FBF7F0}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{width:100%;aspect-ratio:1;border-radius:4px;background:var(--sand)}
.bookrow{display:flex;gap:14px;align-items:center;padding:10px 0;border:none;background:none;width:100%;text-align:left}
#reader{width:100%;border-radius:28px;overflow:hidden;background:#1E1A16;min-height:260px;position:relative}
#reader video{width:100%!important;border-radius:28px}
.qcard{position:relative;overflow:hidden;border-radius:26px;box-shadow:var(--shadow);margin:0 auto;display:flex;flex-direction:column;justify-content:space-between}
.swatch{width:44px;height:44px;border-radius:50%;border:none;box-shadow:inset 0 0 0 1.5px var(--ln)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.swatch[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ac)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.chipbtn{flex-shrink:0;min-height:44px;padding:0 16px;border-radius:22px;border:none;background:var(--card);box-shadow:var(--shadow)}
.chipbtn[aria-pressed=true]{background:var(--ink);color:var(--onInk)}
input[type=range]{accent-color:var(--ac)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.empty{text-align:center;padding:30px 10px}


.sndmenu{position:absolute;right:0;top:58px;width:248px;padding:8px;z-index:6;border-radius:26px;animation:fade .15s}
.sndmenu button.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border:none;border-radius:18px;background:transparent;text-align:left;font-family:var(--D);font-variation-settings:'SOFT' 100;font-size:16px}
.sndmenu button.opt[aria-pressed=true]{background:var(--soft)}
.sndmenu button.opt .ck{margin-left:auto;color:var(--ac)}
/* Feier-Screen */
#fx{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--scrim);animation:fade .25s}
#fx canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.fxcard{position:relative;width:min(360px,100%);background:var(--card);border-radius:36px;box-shadow:var(--shadow);padding:34px 26px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.fxflame{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px;position:relative}
.fxflame::before,.fxflame::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--ac);opacity:0}
.lv2 .fxflame::before,.lv3 .fxflame::before{animation:ring 1.8s ease-out infinite}
.lv3 .fxflame::after{animation:ring 1.8s ease-out .6s infinite}
.fxflame svg{animation:flick 1.6s ease-in-out infinite}
.fxnum{font-family:var(--D);font-variation-settings:'SOFT' 100,'WONK' 1;font-weight:550;line-height:1;font-size:76px;color:var(--ac)}
.lv3 .fxnum{background:linear-gradient(100deg,var(--ac) 20%,#E9C46A 45%,var(--ac) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.4s linear infinite}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
@keyframes shine{to{background-position:-220% 0}}
@media (prefers-reduced-motion: reduce){.fxcard,.fxflame svg,.fxflame::before,.fxflame::after,.lv3 .fxnum{animation:none}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="layer"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="importIn" accept=".json,application/json,text/plain" hidden>
<script>
'use strict';
/* =========================================================
   Reading Journal – Lesetracker mit Timer, Pace-Schätzung & Streak
   Daten bleiben lokal im Browser (localStorage), Export als JSON.
   ========================================================= */
const KEY = 'lesejournal.v1';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const DAY = 864e5;

const ICONS = {
  play:'<path d="M8 5l11 7-11 7z"/>', pause:'<path d="M9 5v14M15 5v14"/>', plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  book:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/>',
  home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/>', chart:'<path d="M5 20V11M12 20V5M19 20v-7"/>',
  quote:'<path d="M9 7H6a1 1 0 0 0-1 1v4h4v4l-2 2M19 7h-3a1 1 0 0 0-1 1v4h4v4l-2 2"/>',
  flame:'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 1.5 1 2.5 2 3 0-3-.5-5.5.5-8z"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', share:'<path d="M12 4v11M8 8l4-4 4 4"/><path d="M5 13v6h14v-6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>', back:'<path d="M15 6l-6 6 6 6"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  image:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20 16l-5-5-8 8"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>', pencil:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
  moon:'<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  sound:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
  mute:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
  rain:'<path d="M7 15a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6 1.4A3.3 3.3 0 0 1 17 15z"/><path d="M8.5 18l-1 2.5M12.5 18l-1 2.5M16.5 18l-1 2.5"/>',
  fire:'<path d="M12 21a6 6 0 0 0 6-6c0-4-3.5-6-4-10-2 1.5-3 3.5-3 6-1-.5-1.5-1.5-1.8-2.5C7.700 10 6 12 6 15a6 6 0 0 0 6 6z"/>',
  wave:'<path d="M3 15c2 0 2.5-1.8 4.5-1.8S9.500 15 12 15s2.5-1.8 4.5-1.8S19 15 21 15"/><path d="M3 19c2 0 2.500-1.800 4.500-1.800S9.500 19 12 19s2.5-1.8 4.5-1.8S19 19 21 19"/><path d="M6 10.5c1-3.500 4-5.500 7.500-5 2.500.5 3.500 2.500 2.500 4"/>',
  leaf:'<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19l7-7"/>',
  trash:'<path d="M5 7h14M9 7V4.5h6V7M7 7l1 13h8l1-13"/>', download:'<path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 19h14"/>'
};
const ic = (n, s = 22, w = 2) => `<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const BLOB = 'M43.6,-58.2C55.9,-49.6,64.2,-35.3,69.4,-19.6C74.6,-3.9,76.7,13.2,70.4,26.5C64.1,39.8,49.4,49.3,34.2,57.5C19,65.7,3.3,72.6,-13.6,72.4C-30.5,72.2,-48.6,64.9,-59.6,51.6C-70.6,38.3,-74.5,19.1,-72.6,1.1C-70.7,-17,-63,-33.9,-50.7,-42.9C-38.4,-51.9,-21.5,-53,-4.8,-46.9C11.9,-40.8,31.3,-66.8,43.6,-58.2Z';
const blob = (x, y, w, op = .9, col = 'var(--blob)') => `<svg class="blob" aria-hidden="true" width="${w}" height="${w}" viewBox="0 0 200 200" style="left:${x}px;top:${y}px;opacity:${op}"><path fill="${col}" d="${BLOB}" transform="translate(100 100)"/></svg>`;

/* ---------------- state ---------------- */
const DEFAULT = { v:1, books:[], sessions:[], quotes:[], settings:{ goalType:'min', goal:30, theme:'auto', fallbackPace:40 }, timer:null };
const freshState = () => structuredClone(DEFAULT);
function normalize(d){
  d = d && typeof d === 'object' ? d : freshState();
  d.settings = Object.assign({}, DEFAULT.settings, d.settings || {});
  ['books','sessions','quotes'].forEach(k => d[k] = Array.isArray(d[k]) ? d[k] : []);
  return d;
}
let S = normalize(freshState());

/* Speicher: IndexedDB (kein 5-MB-Limit), localStorage nur als Notlösung */
const DB = { name: KEY, store: 'kv', db: null, ok: true };
function idb(){
  if (DB.db) return Promise.resolve(DB.db);
  return new Promise((res, rej) => {
    let r; try { r = indexedDB.open(DB.name, 1); } catch(e){ return rej(e); }
    r.onupgradeneeded = () => r.result.createObjectStore(DB.store);
    r.onsuccess = () => { DB.db = r.result; DB.db.onclose = () => { DB.db = null; }; res(DB.db); };
    r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
  });
}
async function idbGet(k){ const db = await idb(); return new Promise((res, rej) => { const t = db.transaction(DB.store, 'readonly').objectStore(DB.store).get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); }
async function idbPut(k, v){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(DB.store, 'readwrite'); tx.objectStore(DB.store).put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); }
async function loadState(){
  try {
    const d = await idbGet('state');
    if (d) return normalize(d);
    let old = null; try { old = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
    const st = normalize(old || freshState());
    await idbPut('state', st);                 // Umzug aus dem alten Speicher
    if (old) try { localStorage.removeItem(KEY); } catch(e){}
    return st;
  } catch(e){
    DB.ok = false;
    try { return normalize(JSON.parse(localStorage.getItem(KEY)) || freshState()); } catch(_){ return normalize(freshState()); }
  }
}
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 250); }
async function flush(){
  clearTimeout(saveTimer); saveTimer = null;
  const snap = JSON.parse(JSON.stringify(S));
  if (DB.ok){ try { await idbPut('state', snap); return; } catch(e){ DB.ok = false; } }
  try { localStorage.setItem(KEY, JSON.stringify(snap)); } catch(e){ toast('Speichern fehlgeschlagen – bitte eine Sicherung exportieren.'); }
}
// beim Wegwischen / Sperren sofort sichern (wichtig auf Android & iOS)
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) flush(); });
addEventListener('pagehide', () => { if (saveTimer) flush(); });
async function askPersist(){ try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch(e){} }

/* ---------------- date helpers ---------------- */
const dkey = d => { d = new Date(d); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const today = () => dkey(new Date());
const addDays = (k, n) => { const [y,m,d] = k.split('-').map(Number); return dkey(new Date(y, m-1, d+n)); };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const weekdayOf = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d).getDay(); };
function dayLabel(iso){
  const k = dkey(iso), t = today();
  if (k === t) return 'Heute'; if (k === addDays(t,-1)) return 'Gestern';
  const d = new Date(iso);
  if (Date.now() - d < 6*DAY) return ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][d.getDay()];
  return d.toLocaleDateString('de-DE', { day:'numeric', month:'short' });
}
const fmtMin = m => { m = Math.round(m); if (m < 60) return `${m} min`; const h = Math.floor(m/60), r = m%60; return r ? `${h} h ${String(r).padStart(2,'0')}` : `${h} h`; };
const fmtHours = m => { if (m < 90) return `${Math.max(1,Math.round(m))} Minuten`; const h = m/60; return h < 10 ? `${(Math.round(h*2)/2).toLocaleString('de-DE')} Stunden` : `${Math.round(h)} Stunden`; };
const clock = ms => { const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 2,'0') + ':' + String(x).padStart(2,'0'); };

/* ---------------- domain ---------------- */
const book = id => S.books.find(b => b.id === id);
const sessOf = id => S.sessions.filter(s => s.bookId === id);
const curPage = b => Math.max(b.startPage || 0, ...sessOf(b.id).map(s => s.to));
const pages = s => Math.max(0, s.to - s.from);
function pace(bookId){
  const calc = list => { const m = list.filter(s => !s.est && s.min >= 5 && pages(s) > 0); const p = m.reduce((a,s)=>a+pages(s),0), t = m.reduce((a,s)=>a+s.min,0); return { n:m.length, pace: t ? p/t*60 : 0 }; };
  if (bookId){ const r = calc(sessOf(bookId)); if (r.n) return { ...r, src:'book' }; }
  const all = calc(S.sessions); if (all.n) return { ...all, src:'all' };
  return { n:0, pace:S.settings.fallbackPace || 40, src:'default' };
}
const paceTxt = p => p.src === 'book' ? `Schnitt aus ${p.n} gemessenen Sitzung${p.n>1?'en':''} in diesem Buch` : p.src === 'all' ? `noch keine Messung in diesem Buch – Schnitt aus all deinen Büchern` : `noch keine Messung – Standardwert aus den Einstellungen`;
function currentBook(){
  if (S.timer) return book(S.timer.bookId);
  const reading = S.books.filter(b => b.status === 'reading');
  if (!reading.length) return null;
  const last = b => Math.max(+new Date(b.added || 0), ...sessOf(b.id).map(s => +new Date(s.date)));
  return reading.sort((a,b) => last(b) - last(a))[0];
}
function dayTotals(){
  const m = {};
  S.sessions.forEach(s => { const k = dkey(s.date); m[k] = m[k] || { min:0, pages:0 }; m[k].min += s.min || 0; m[k].pages += pages(s); });
  return m;
}
const goalVal = t => t ? (S.settings.goalType === 'min' ? t.min : t.pages) : 0;
const met = (tot, k) => goalVal(tot[k]) >= S.settings.goal;
function streak(){
  const tot = dayTotals(); let k = today(); let n = 0;
  const todayMet = met(tot, k);
  if (!todayMet) k = addDays(k, -1);
  while (met(tot, k)) { n++; k = addDays(k, -1); }
  return { n, todayMet, todayVal: goalVal(tot[today()]), tot };
}
function liveMs(){ const t = S.timer; if (!t) return 0; return t.acc + (t.running ? Date.now() - t.since : 0); }

function toast(msg){ const d = document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent = msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 2600); }
function coverHTML(b, w, h, tilt = 0){
  const fs = Math.max(10, Math.round(w/8));
  const inner = b && b.cover ? `<img src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  const ph = `<div class="ph" style="font-size:${fs}px"><span>${esc(b?.title || 'Buch')}</span>${w>60?`<small style="font-size:${Math.max(9,fs-4)}px">${esc(b?.author||'')}</small>`:''}</div>`;
  const hue = b ? [...(b.title||'')].reduce((a,c)=>a+c.charCodeAt(0),0) % 4 : 0;
  const bg = ['#3E5A48','#7A3B2A','#36475E','#6A5A3A'][hue];
  return `<div class="cover" style="width:${w}px;height:${h}px;background:${bg};transform:rotate(${tilt}deg)">${ph}${inner}</div>`;
}
function tabs(){
  const it = [['home','home','Heute'],['shelf','book','Regal'],['stats','chart','Statistik'],['quotes','quote','Zitate']];
  return `<nav class="tabs" aria-label="Hauptnavigation">${it.map(([v,i,l]) => `<button data-act="tab" data-v="${v}" aria-label="${l}" ${view===v?'aria-current="page"':''}>${ic(i,21,1.9)}<span>${l}</span></button>`).join('')}</nav>`;
}

function fitCard(){
  const p = $('#cardText'), box = $('.qcard'); if (!p || !box) return;
  let fs = sheet.c.size; p.style.fontSize = fs + 'px';
  const cs = getComputedStyle(box), avail = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const used = () => [...box.children].filter(el => !el.classList.contains('blob')).reduce((a, el) => a + el.offsetHeight, 0) + 12;
  while (used() > avail && fs > 10){ fs -= 1; p.style.fontSize = fs + 'px'; }
  const l = $('#sLabel'); if (l) l.textContent = fs < sheet.c.size ? `${fs} pt (passt)` : `${fs} pt`;
}
function cursorEnd(el){ try { const n = el.value.length; el.setSelectionRange(n, n); } catch(e){} }
document.addEventListener('focusin', e => { if (e.target.matches?.('[data-endcursor]')) { const el = e.target; setTimeout(() => cursorEnd(el), 0); setTimeout(() => cursorEnd(el), 80); } });
function renderLayer(){
  const L = $('#layer');
  const keep = sheet && L.dataset.type === sheet.type && L.dataset.id === String(sheet.id ?? '') ? [...L.querySelectorAll('.full, .sheet, .hscroll')].map(el => [el.scrollTop, el.scrollLeft]) : null;
  if (!sheet){ L.innerHTML = ''; L.dataset.type = ''; stopScanner(); return; }
  const fn = SHEETS[sheet.type];
  L.innerHTML = fn();
  L.dataset.type = sheet.type; L.dataset.id = String(sheet.id ?? '');
  if (keep) [...L.querySelectorAll('.full, .sheet, .hscroll')].forEach((el, i) => { if (keep[i]) { el.scrollTop = keep[i][0]; el.scrollLeft = keep[i][1]; } });
  const f = L.querySelector('[data-autofocus]'); if (f && !sheet._focused){ sheet._focused = true; setTimeout(()=>{ f.focus(); cursorEnd(f); }, 50); }
  if (sheet.type === 'add' && sheet.mode === 'scan') startScanner(); else stopScanner();
  if (sheet.type === 'card') { fitCard(); document.fonts && document.fonts.ready.then(fitCard); }
}
function open(type, data = {}){ sheet = { type, ...data }; renderLayer(); }
function close(){ sheet = null; renderLayer(); render(); }

function streakCard(){
  const st = streak(), g = S.settings.goal, unit = S.settings.goalType === 'min' ? 'min' : 'Seiten';
  const tot = st.tot, t = today();
  const days = [...Array(7)].map((_,i) => addDays(t, i-6));
  const left = Math.max(0, g - st.todayVal);
  const pct = Math.min(100, st.todayVal / g * 100);
  return `<button class="card rel" data-act="goal" style="border:none;text-align:left;width:100%;display:flex;flex-direction:column;gap:14px" aria-label="Lesestreak: ${st.n} Tage. Ziel einstellen">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div class="row" style="gap:14px">
        <div style="width:54px;height:54px;border-radius:50%;background:${st.todayMet?'var(--ac)':'var(--sand)'};color:${st.todayMet?'#FBF7F0':'var(--ac)'};display:flex;align-items:center;justify-content:center">${ic('flame',28,2)}</div>
        <div><div class="d" style="font-size:30px;font-weight:550;line-height:1">${st.n} ${st.n===1?'Tag':'Tage'}</div>
        <div class="label">${st.n ? 'in Folge gelesen' : 'Starte heute deine Serie'}</div></div>
      </div>
      <span class="mu" aria-hidden="true">${ic('gear',20,1.8)}</span>
    </div>
    <div class="stack" style="gap:6px">
      <div class="bar ac"><i style="width:${pct}%"></i></div>
      <div class="row mu" style="justify-content:space-between;font-size:15px"><span>Heute <span class="d" style="color:var(--ink)">${Math.round(st.todayVal)}</span> von ${g} ${unit}</span><span>${st.todayMet ? 'Ziel erreicht' : `noch ${Math.ceil(left)} ${unit}`}</span></div>
    </div>
    <div class="week" aria-hidden="true">${days.map(k => `<div><b class="${met(tot,k)?'on':''} ${k===t?'today':''}">${met(tot,k)?ic('check',15,2.6):''}</b>${WD[weekdayOf(k)]}</div>`).join('')}</div>
  </button>`;
}

function finishedAt(b){ if (b.finished) return b.finished; const ss = sessOf(b.id); return ss.length ? ss.reduce((a,x) => x.date > a ? x.date : a, ss[0].date) : b.added; }

}
function backupAge(){
  const st = S.settings;
  const since = st.lastBackup || S.books.reduce((a,b) => b.added && b.added < a ? b.added : a, new Date().toISOString());
  const d = Math.floor((Date.now() - +new Date(since)) / DAY);
  const span = d >= 60 ? `${Math.floor(d/30)} Monaten` : d === 1 ? '1 Tag' : `${d} Tagen`;
  return st.lastBackup ? `Letzte Sicherung vor ${span}` : `Seit ${span} ohne Sicherung`;
}

function stats(){
  const tot = dayTotals(), t = today();
  const sum = n => { let m = 0, p = 0; for (let i = 0; i < n; i++){ const d = tot[addDays(t,-i)]; if (d){ m += d.min; p += d.pages; } } return { m, p }; };
  const w = sum(7), mo = sum(30);
  const done = S.books.filter(b => b.status === 'done').length;
  const maxStreak = (() => { const ks = Object.keys(tot).sort(); let best = 0, cur = 0, prev = null; ks.forEach(k => { if (!met(tot,k)) { cur = 0; prev = k; return; } cur = prev && addDays(prev,1) === k && met(tot,prev) ? cur + 1 : 1; best = Math.max(best, cur); prev = k; }); return best; })();
  const days = [...Array(7)].map((_,i) => addDays(t, i-6)); const mx = Math.max(30, ...days.map(k => tot[k]?.min || 0));
  const bars = days.map(k => { const v = tot[k]?.min || 0; return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:100%;height:110px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.max(4, v/mx*110)}px;border-radius:12px;background:${k===t?'var(--ac)':'var(--sage)'};opacity:${v?1:.25}"></div></div><span class="mu" style="font-size:13px">${WD[weekdayOf(k)]}</span></div>`; }).join('');
  // heatmap 16 Wochen, beginnend Montag
  let start = addDays(t, -(16*7 - 1)); while (weekdayOf(start) !== 1) start = addDays(start, -1);
  const cells = []; for (let k = start; k <= t; k = addDays(k,1)) { const v = tot[k]?.min || 0; const lv = v === 0 ? 0 : v < 15 ? .3 : v < 30 ? .5 : v < 60 ? .75 : 1; cells.push(`<i style="${lv?`background:var(--ac);opacity:${lv}`:''}" title="${k}: ${Math.round(v)} min"></i>`); }
  const paces = S.books.map(b => ({ b, p: pace(b.id) })).filter(x => x.p.src === 'book');
  const pmx = Math.max(60, ...paces.map(x => x.p.pace));
  const tile = (v, l) => `<div class="card" style="padding:16px 18px"><div class="d" style="font-size:28px;line-height:1.05">${v}</div><div class="label">${l}</div></div>`;
  return `${blob(-80, -40, 260, .6)}
  <div class="stack">
    <h1 class="d rel">Statistik</h1>
    <div class="rel" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${tile(fmtMin(w.m), 'diese 7 Tage')}${tile(w.p + ' S.', 'Seiten, 7 Tage')}${tile(fmtMin(mo.m), 'letzte 30 Tage')}${tile(maxStreak + ' Tage', 'längste Serie')}
    </div>
    <div class="card rel"><div class="d" style="font-size:19px;margin-bottom:12px">Minuten pro Tag</div><div class="row" style="gap:8px;align-items:flex-end">${bars}</div></div>
    <div class="card rel"><div class="d" style="font-size:19px;margin-bottom:12px">Dein Lesekalender</div><div class="heat" role="img" aria-label="Lesetage der letzten 16 Wochen">${cells.join('')}</div><div class="label" style="margin-top:10px">${done} ${done===1?'Buch':'Bücher'} ausgelesen</div></div>
    <div class="card rel"><div class="d" style="font-size:19px;margin-bottom:8px">Tempo pro Buch</div>
      ${paces.length ? paces.map(({b,p}) => `<div style="padding:8px 0"><div class="row" style="justify-content:space-between"><span>${esc(b.title)}</span><span class="d">${Math.round(p.pace)} S./h</span></div><div class="bar" style="height:8px;margin-top:6px"><i style="width:${p.pace/pmx*100}%"></i></div></div>`).join('') : '<div class="mu">Sobald du eine Sitzung mit Timer gemessen hast, erscheint hier dein Tempo.</div>'}
    </div>
  </div>`;
}

/* ---------------- ISBN & lookup ---------------- */
function normIsbn(s){
  s = String(s || '').toUpperCase().replace(/[^0-9X]/g, '');
  if (s.length === 10){ const core = '978' + s.slice(0,9); let sum = 0; for (let i = 0; i < 12; i++) sum += +core[i] * (i % 2 ? 3 : 1); return core + ((10 - sum % 10) % 10); }
  return s.length === 13 ? s : null;
}
async function getJSON(url, ms = 8000){ const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms); try { const r = await fetch(url, { signal:c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(t); } }
const httpsify = u => u ? u.replace(/^http:/, 'https:').replace('&edge=curl','') : '';
async function lookupIsbn(isbn){
  const out = { isbn };
  try {
    const j = await getJSON(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const d = j[`ISBN:${isbn}`];
    if (d){ out.title = d.title + (d.subtitle ? ' – ' + d.subtitle : ''); out.author = (d.authors||[]).map(a=>a.name).join(', '); out.pages = d.number_of_pages || ''; out.publisher = (d.publishers||[])[0]?.name || ''; out.year = (d.publish_date||'').match(/\d{4}/)?.[0] || ''; out.cover = d.cover?.large || d.cover?.medium || ''; }
  } catch(e){}
  if (!out.title || !out.cover || !out.pages){
    try {
      const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
      const v = j.items?.[0]?.volumeInfo;
      if (v){ out.title ||= v.title + (v.subtitle ? ' – ' + v.subtitle : ''); out.author ||= (v.authors||[]).join(', '); out.pages ||= v.pageCount || ''; out.publisher ||= v.publisher || ''; out.year ||= (v.publishedDate||'').slice(0,4); out.cover ||= httpsify(v.imageLinks?.thumbnail || v.imageLinks?.smallThumbnail); }
    } catch(e){}
  }
  return out.title ? out : null;
}
async function searchTitle(q){
  let res = [];
  try {
    const j = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=10&printType=books`);
    res = (j.items||[]).map(it => { const v = it.volumeInfo; const id = (v.industryIdentifiers||[]); return { title:v.title + (v.subtitle?' – '+v.subtitle:''), author:(v.authors||[]).join(', '), pages:v.pageCount||'', publisher:v.publisher||'', year:(v.publishedDate||'').slice(0,4), cover:httpsify(v.imageLinks?.thumbnail), isbn:(id.find(x=>x.type==='ISBN_13')||id.find(x=>x.type==='ISBN_10')||{}).identifier||'' }; });
  } catch(e){}
  if (!res.length){
    try {
      const j = await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=10&fields=title,author_name,isbn,number_of_pages_median,cover_i,first_publish_year,publisher`);
      res = (j.docs||[]).map(d => ({ title:d.title, author:(d.author_name||[]).join(', '), pages:d.number_of_pages_median||'', publisher:(d.publisher||[])[0]||'', year:d.first_publish_year||'', cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`:'', isbn:(d.isbn||[]).find(x=>x.length===13)||'' }));
    } catch(e){}
  }
  return res;
}
async function handleIsbn(raw){
  const isbn = normIsbn(raw);
  if (!isbn){ toast('Das sieht nicht nach einer ISBN aus.'); return; }
  const dup = S.books.find(b => b.isbn === isbn);
  if (dup){ toast('Das Buch steht schon in deinem Regal.'); open('book', { id:dup.id }); return; }
  sheet.busy = true; renderLayer();
  const r = await lookupIsbn(isbn);
  if (!navigator.onLine) toast('Keine Internetverbindung – bitte selbst eintragen.');
  openEdit({ isbn, status:'reading', ...(r||{}) }, true, !!r);
  if (!r) toast('Nichts gefunden – trag die Daten einfach selbst ein.');
}
function openEdit(draft, isNew, found){ sheet = { type:'edit', draft:{ status:'reading', startPage:0, ...draft }, isNew, found }; renderLayer(); }

/* ---------------- scanner ---------------- */
let scanner = null, scanning = false, libLoading = null;
function loadLib(){ if (window.Html5Qrcode) return Promise.resolve(); if (libLoading) return libLoading; libLoading = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'; s.onload = res; s.onerror = () => { libLoading = null; rej(); }; document.head.appendChild(s); }); return libLoading; }
async function startScanner(){
  if (scanning) return; scanning = true;
  const msg = t => { const m = $('#scanMsg'); if (m) m.textContent = t; };
  try { await loadLib(); } catch(e){ scanning = false; msg('Scanner konnte nicht geladen werden – bitte ISBN eintippen.'); return; }
  if (!$('#reader')) { scanning = false; return; }
  try {
    scanner = new Html5Qrcode('reader', { formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A], verbose:false });
    await scanner.start({ facingMode:'environment' }, { fps:12, qrbox:(w,h) => ({ width:Math.min(300, w*.85), height:Math.min(140, h*.5) }), aspectRatio:1.333 }, async text => {
      const isbn = normIsbn(text);
      if (!isbn || !/^97[89]/.test(isbn)) { msg('Das ist kein Buch-Strichcode. Probier den anderen auf der Rückseite.'); return; }
      if (navigator.vibrate) navigator.vibrate(40);
      await stopScanner(); handleIsbn(isbn);
    }, () => {});
  } catch(e){ scanning = false; msg('Kein Kamerazugriff. Erlaube die Kamera in den Browser-Einstellungen oder tippe die ISBN ein.'); }
}
async function stopScanner(){ scanning = false; if (scanner){ const s = scanner; scanner = null; try { await s.stop(); } catch(e){} try { s.clear(); } catch(e){} } }

/* ---------------- cover photo ---------------- */
function resizeImage(file, max = 600){
  return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file); img.onload = () => { const sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82)); }; img.onerror = rej; img.src = url; });
}
$('#fileIn').addEventListener('change', async e => { const f = e.target.files[0]; e.target.value = ''; if (!f || !sheet || sheet.type !== 'edit') return; readDraft(); try { sheet.draft.cover = await resizeImage(f); renderLayer(); } catch(_){ toast('Bild konnte nicht gelesen werden.'); } });

/* ---------------- quote card export ---------------- */
function wrapLines(ctx, text, maxW){
  const words = text.split(/\s+/), lines = []; let line = '';
  words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; });
  if (line) lines.push(line); return lines;
}
async function exportCard(){
  const q = S.quotes.find(x => x.id === sheet.id), b = book(q.bookId), c = sheet.c, bg = CARD_BGS[c.bg];
  const W = 1080, H = c.fmt === '4:5' ? 1350 : c.fmt === '1:1' ? 1080 : 1920, k = W / 300;
  const F = fontMeta(c.font), style = c.ital && F.ital ? 'italic' : 'normal', fw = clampW(F, c.w), qf = F.script ? 'Cormorant Garamond' : c.font, lh = F.script ? 1.15 : 1.38;
  try { await Promise.all([document.fonts.load(`${style} ${fw} 40px "${c.font}"`), document.fonts.load(`400 40px "${qf}"`), document.fonts.load('italic 400 40px "Newsreader"'), document.fonts.load('400 40px "Newsreader"')]); } catch(e){}
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  ctx.fillStyle = bg.bg; ctx.fillRect(0, 0, W, H);
  ctx.save(); const bs = W*.85/200; ctx.translate(W*.5 + 100*bs, H - W*.6 + 100*bs); ctx.scale(bs, bs); ctx.fillStyle = bg.blob; ctx.fill(new Path2D(BLOB)); ctx.restore();
  const padX = W*.1, padY = W*.11, maxW = W - padX*2;
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = c.align === 'center' ? 'center' : 'left';
  const x = c.align === 'center' ? W/2 : padX;
  ctx.fillStyle = bg.ac; ctx.font = `400 ${64*k}px "${qf}", serif`; ctx.fillText('“', x, padY + 40*k);
  let size = c.size * k; ctx.font = `${style} ${fw} ${size}px "${c.font}", serif`;
  let lines = wrapLines(ctx, q.text, maxW); const avail = H - padY*2 - 100*k;
  while (lines.length * size * lh > avail && size > 20){ size -= 2; ctx.font = `${style} ${fw} ${size}px "${c.font}", serif`; lines = wrapLines(ctx, q.text, maxW); }
  const blockH = lines.length * size * lh; let y = (H - blockH)/2 + size;
  ctx.fillStyle = bg.fg; lines.forEach(l => { ctx.fillText(l, x, y); y += size * lh; });
  ctx.globalAlpha = .8; ctx.font = `400 ${14*k}px "Newsreader", serif`;
  const src = [b?.author, b?.title].filter(Boolean).join(', '); ctx.fillText(src, x, H - padY);

  const file = new File([blobOut], 'zitat.png', { type:'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file] }); return; } } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blobOut); a.download = 'zitat.png'; document.body.appendChild(a); a.click(); a.remove();
  toast('Bild gespeichert.');
}

const BACKUP_DAYS = 30;
function backupDue(){
  const st = S.settings; if (S.sessions.length < 5) return false;
  const now = Date.now();
  if (st.backupSnooze && now < +new Date(st.backupSnooze)) return false;
  const last = st.lastBackup ? +new Date(st.lastBackup) : +new Date(S.books.reduce((a,b) => b.added && b.added < a ? b.added : a, new Date().toISOString()));
  return now - last > BACKUP_DAYS * DAY;
}

let confettiRAF = 0;

  const count = lv >= 3 ? 150 : lv >= 2 ? 70 : lv >= 1 ? 28 : 12;
  const P = [];
  const burst = (x, y, n, power) => { for (let i = 0; i < n; i++){ const a = -Math.PI/2 + (Math.random() - .5) * (lv >= 2 ? 2.4 : 1.6), v = power * (.55 + Math.random() * .6);

  const t0 = performance.now(); let lastWave = t0;
  const step = now => {
    if (lv >= 3 && wave < maxWaves && now - lastWave > 900){ wave++; lastWave = now; burst(W * (.2 + Math.random() * .6), H * .8, 50, 16); }
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.life++; p.vy += .22; p.vx *= .99; p.vy *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - p.life / 220);

      else if (p.shape === 1){ ctx.beginPath(); ctx.arc(0, 0, p.r/1.6, 0, 6.3); ctx.fill(); }
      else { ctx.beginPath(); for (let k = 0; k < 4; k++){ ctx.rotate(Math.PI/2); ctx.lineTo(0, p.r); ctx.lineTo(p.r/4, p.r/4); } ctx.fill(); }

}

const SOUNDS = [ ['none','Kein Klang','mute'], ['fire','Lagerfeuer','fire'], ['rain','Nieselregen','rain'], ['noise','White Noise','wave'] ];

    let next = ctx.currentTime;
    return now => { while (next < now + .25){
      const big = Math.random() < .08;
      burst(ctx, out, next, big ? rnd(.02, .035) : rnd(.006, .014), 'bandpass', big ? rnd(1200, 2200) : rnd(2500, 5500), big ? 3 : 2.2, big ? rnd(.05, .09) : rnd(.015, .05), rnd(-.9, .9));

    const done = $('#doneIn'); if (done && done.checked){ b.status = 'done'; b.finished = date; } else if (b.status === 'want') b.status = 'reading';
    if (sheet.timer) { S.timer = null; ambStop(); }
    save(); close();
    celebrate({ pages: to - from, min, est, wasMet, bookDone, title: b.title, bookId: b.id });
  },
  editSess: el => open('editSess', { id:el.dataset.id }),
  saveSess: () => { const s = S.sessions.find(x => x.id === sheet.id); const f = +$('#f_from').value, t = +$('#f_to').value, m = +$('#f_min').value, d = $('#f_date').value; if (!(t > f) || !(m > 0)) return toast('Bitte Seiten und Minuten prüfen.'); Object.assign(s, { from:f, to:t, min:m, est:$('#f_est').checked ? (s.est || true) : false }); if (d && d !== dkey(s.date)) s.date = new Date(d + 'T20:00:00').toISOString(); save(); close(); toast('Gespeichert.'); },
  delSess: () => { if (!sheet.confirmDel){ sheet.confirmDel = true; return renderLayer(); } S.sessions = S.sessions.filter(s => s.id !== sheet.id); save(); close(); toast('Sitzung gelöscht.'); },
  goal: () => open('goal'),
  goalType: el => { const g = S.settings; if (g.goalType === el.dataset.v) return; g.goalType = el.dataset.v; g.goal = g.goalType === 'min' ? 30 : 20; save(); renderLayer(); },
  goalStep: el => { const g = S.settings; g.goal = Math.max(1, g.goal + +el.dataset.d - (g.goal % 5 && +el.dataset.d > 0 ? g.goal % 5 : 0)); save(); renderLayer(); },
  goalSet: el => { S.settings.goal = +el.dataset.v; save(); renderLayer(); },
  settings: () => open('settings'),
  theme: el => { S.settings.theme = el.dataset.v; save(); applyTheme(); renderLayer(); },
  export: () => exportBackup(),
  import: () => $('#importIn').click(),
  snooze: () => { S.settings.backupSnooze = new Date(Date.now() + 7*DAY).toISOString(); save(); render(); },
  newQuote: el => { if (!S.books.length && el.dataset.from !== 'timer') { /* Zitat ohne Buch erlaubt */ } open('quote', { bookId: el.dataset.from === 'timer' ? S.timer?.bookId : undefined, back: el.dataset.from }); },
  saveQuote: () => { const text = $('#qText').value.trim(); if (!text) return toast('Bitte das Zitat eintragen.'); S.quotes.push({ id:uid(), text, bookId:$('#qBook').value, page:$('#f_qPage').value, date:new Date().toISOString() }); save(); const back = sheet.back; if (back === 'timer' && S.timer){ open('timer'); render(); } else close(); toast('Zitat gespeichert.'); },
  card: el => open('card', { id:el.dataset.id }),
  cf: el => { const c = sheet.c, P = fontMeta(c.font), F = fontMeta(el.dataset.v); c.font = F.f; c.w = clampW(F, c.w); if (F.script && !P.script) c.size = 32; if (!F.script && P.script) c.size = 21; rememberCard(); renderLayer(); },
  cit: el => { sheet.c.ital = el.dataset.v === '1'; rememberCard(); renderLayer(); },
  cbg: el => { sheet.c.bg = +el.dataset.v; rememberCard(); renderLayer(); },
  cfmt: el => { sheet.c.fmt = el.dataset.v; rememberCard(); renderLayer(); },
  cal: el => { sheet.c.align = el.dataset.v; rememberCard(); renderLayer(); },
  exportCard: () => exportCard().catch(() => toast('Export hat nicht geklappt.')),
  delQuote: () => { if (!sheet.confirmDel){ sheet.confirmDel = true; return renderLayer(); } S.quotes = S.quotes.filter(q => q.id !== sheet.id); save(); close(); toast('Zitat gelöscht.'); }
};
document.addEventListener('click', e => { if (sheet?.soundMenu && !e.target.closest('.sndmenu') && !e.target.closest('[data-act="soundMenu"]')) { sheet.soundMenu = false; renderLayer(); } const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return; const f = ACT[el.dataset.act]; if (f){ e.preventDefault(); f(el); } });
document.addEventListener('input', e => {
  if (e.target.dataset?.act === 'svol'){ const v = +e.target.value / 100; S.settings.soundVol = v; save(); if (AMB.master) AMB.master.gain.setTargetAtTime(v, AMB.ctx.currentTime, .1); }
  if (e.target.matches?.('[data-endcursor]')){ const v = e.target.value.replace(/[^0-9]/g, ''); if (v !== e.target.value) e.target.value = v; }
  if (e.target.id === 'minIn'){ sheet.manMin = e.target.value; e.target.style.width = Math.max(2, e.target.value.length) + 'ch'; }
  if (e.target.id === 'tminIn' && sheet?.type === 'log'){
    const b = book(sheet.id), from = sheet.from ?? curPage(b), m = Math.max(0, +e.target.value || 0); sheet.tmin = m;
    let to = from + Math.max(1, Math.round(m * pace(b.id).pace / 60)); if (b.pages) to = Math.min(b.pages, to);
    const a = $('#tTo'), n = $('#tN'); if (a) a.textContent = to; if (n) n.textContent = to - from;
  }
  if (e.target.id === 'toIn' && sheet?.type === 'log'){
    const b = book(sheet.id), from = sheet.from ?? curPage(b), to = +e.target.value || from, n = Math.max(0, to - from);
    sheet.to = to; const np = $('#nPages'); if (np) np.textContent = n;
    const em = $('#estMin'); if (em) em.textContent = fmtMin(n / pace(b.id).pace * 60);
    const dn = $('#doneIn'); if (dn && b.pages) dn.checked = to >= b.pages;
  }
  if (e.target.dataset.act === 'csz'){ sheet.c.size = +e.target.value; fitCard(); rememberCard(); }
  if (e.target.dataset.act === 'cw'){ const F = fontMeta(sheet.c.font); sheet.c.w = clampW(F, +e.target.value); const p = $('#cardText'); if (p) p.style.fontWeight = sheet.c.w; const l = $('#wLabel'); if (l) l.textContent = wName(sheet.c.w); fitCard(); rememberCard(); }
  if (e.target.id === 'fbIn'){ const v = +e.target.value; if (v > 0){ S.settings.fallbackPace = v; save(); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'isbnIn') ACT.isbnGo();
  if (e.key === 'Enter' && e.target.id === 'titleIn') ACT.titleGo();
  if (e.key === 'Escape' && $('#fx')) { $('#fx').remove(); stopConfetti(); return; }
  if (e.key === 'Escape' && sheet) close();
});

/* live timer tick */
setInterval(() => {
  if (!S.timer) return;
  const ms = liveMs();
  document.querySelectorAll('[data-live]').forEach(el => el.textContent = clock(ms));
  const ep = $('[data-estpage]'); if (ep){ const p = pace(S.timer.bookId); ep.textContent = 'Seite ' + Math.round(S.timer.from + ms/3.6e6*p.pace); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!sheet) render(); } });

(async function init(){
  S = await loadState();
  applyTheme(); render();
  if (S.timer) open('timer');
  askPersist();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
